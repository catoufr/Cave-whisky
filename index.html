<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ma Cave à Whisky</title>
<meta name="description" content="Ma collection de whisky : fiches, photos, notes de dégustation.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#eceeea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121512" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: one narrow column (phone first). Sticky header with tabs, then a list / detail / form view. */
:root{
  --bg:#eceeea; --surface:#fafaf8; --fg:#1a1e1b; --muted:#5b645d; --line:#d3d8d2;
  --accent:#9c5608; --accent-fg:#ffffff; --accent-soft:#f1e2cb;
  --st-sealed:#2f6aa6; --st-open:#2f7d44; --st-empty:#6f756f;
  --danger:#b0352b;
  --f-display:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121512; --surface:#1b1f1b; --fg:#ecefe9; --muted:#9aa399; --line:#2f352f;
    --accent:#e2a350; --accent-fg:#1a1206; --accent-soft:#3a2c14;
    --st-sealed:#7db0e8; --st-open:#7cc58e; --st-empty:#9aa099; --danger:#ee8b80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121512; --surface:#1b1f1b; --fg:#ecefe9; --muted:#9aa399; --line:#2f352f;
  --accent:#e2a350; --accent-fg:#1a1206; --accent-soft:#3a2c14;
  --st-sealed:#7db0e8; --st-open:#7cc58e; --st-empty:#9aa099; --danger:#ee8b80;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.app{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:1.6rem;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:.82rem;font-family:var(--f-mono)}
.tabs{display:flex;gap:6px;margin-top:10px}
.verline{margin:0 0 10px;font-size:.9rem}
.tabdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle}
.tab[aria-current="page"] .tabdot{background:var(--accent-fg)}
.tab{flex:1;padding:9px 8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:500;font-size:.9rem}
.tab[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
main{padding-block:16px;display:flex;flex-direction:column;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-weight:600;text-decoration:none;font-size:.92rem}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.small{padding:6px 10px;font-size:.82rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{margin:0;color:var(--muted);font-size:.82rem}
.banner{padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
/* filters */
.bar{display:flex;gap:8px}
.bar input[type=search]{flex:1;min-width:0}
input[type=text],input[type=search],input[type=number],input[type=url],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
textarea{min-height:90px;resize:vertical}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;font-size:.9rem}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:.82rem;font-family:var(--f-mono)}
/* list */
#results{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.item:hover{border-color:var(--accent)}
.thumb{width:56px;height:72px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:26px;height:26px}
.it-name{font-family:var(--f-display);font-weight:600;font-size:1.05rem;line-height:1.2;overflow-wrap:anywhere}
.it-sub{color:var(--muted);font-size:.82rem;margin-top:2px;overflow-wrap:anywhere}
.it-tags{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.score{text-align:right;font-family:var(--f-mono);font-size:1.5rem;font-weight:500;line-height:1}
.score small{display:block;font-size:.65rem;color:var(--muted);margin-top:3px;letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:.74rem;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.st-sealed{--c:var(--st-sealed)}.st-open{--c:var(--st-open)}.st-empty{--c:var(--st-empty)}
.mark{font-size:.74rem;font-weight:600;color:var(--accent)}
.empty{padding:32px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{font-size:1.2rem}
/* detail */
.photos{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory}
.photos img{height:260px;max-width:85%;border-radius:10px;scroll-snap-align:start;object-fit:cover;background:var(--accent-soft)}
.d-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.d-head h2{font-size:1.6rem;line-height:1.15;overflow-wrap:anywhere}
.big{font-family:var(--f-mono);font-size:2.4rem;line-height:1;text-align:right}
.big small{display:block;font-size:.7rem;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 16px;margin:0}
.facts dt{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:500}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:8px 6px;border:0;background:var(--surface);font-size:.85rem;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--c);color:var(--accent-fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip.static{background:var(--accent-soft);border-color:transparent}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,9.5rem) 1fr 2ch;gap:10px;align-items:center;font-size:.88rem}
.track{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:4px}
.bar-row b{font-family:var(--f-mono);font-weight:500;text-align:right}
.sec h3{font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-family:var(--f-body);font-weight:700}
.links a{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none;overflow-wrap:anywhere}
.links a:hover{color:var(--accent)}
.links span{font-family:var(--f-mono);color:var(--muted);white-space:nowrap}
.notes{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
/* form */
form{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.photo-grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ph{position:relative;width:110px;height:140px}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
.ph-x,.x{border:0;background:var(--surface);color:var(--fg);border:1px solid var(--line);width:28px;height:28px;border-radius:50%;line-height:1;font-size:1rem}
.ph-x{position:absolute;top:4px;right:4px}
.rate{padding:8px 0;border-bottom:1px solid var(--line)}
.rate:last-child{border-bottom:0}
.rate-top{display:flex;align-items:center;gap:10px}
.rate-top label{flex:1;font-weight:500}
.rate-top output{font-family:var(--f-mono);font-size:1.1rem;min-width:2ch;text-align:right}
.rsel{width:5.5rem;min-height:44px;font-family:var(--f-mono);font-size:1.05rem;text-align:center;text-align-last:center}
.rate.unset .rsel{color:var(--muted)}
.ends{font-size:.75rem;font-weight:400;color:var(--muted)}
.linkrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.linkrow input:nth-child(2){grid-column:1 / -1;order:3}
.err{color:var(--danger);font-size:.85rem;margin:0}
.auto{border-color:var(--accent)!important;background:var(--accent-soft)!important}
.guess{border-style:dashed!important}
.tabs .tab{padding-inline:4px;font-size:.84rem}
.filebtn{position:relative;overflow:hidden}
.filebtn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px;padding:0;border:0}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.pickbox{max-height:220px;overflow:auto;padding:8px 12px}
button:disabled{opacity:.55;cursor:default}
details summary{cursor:pointer;font-weight:600}
code,pre{font-family:var(--f-mono);font-size:.76rem}
pre{overflow-x:auto;background:var(--bg);padding:10px;border-radius:8px;margin:8px 0}
.save{position:sticky;bottom:0;z-index:15;display:flex;gap:8px;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.save .btn{flex:1}
.flist{display:flex;flex-direction:column}
.frow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .nm{flex:1;font-weight:500;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.item{transition:border-color .15s}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="toast" hidden role="status"></div>
<script src="vendor/jszip.min.js"></script>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};

var CRITERIA=[
  {k:'sweet',label:'Sec ↔ Sucré'},
  {k:'smoke',label:'Fumé / tourbé'},
  {k:'spice',label:'Épicé'},
  {k:'cereal',label:'Céréales'},
  {k:'alcohol',label:'Fort en alcool'},
  {k:'fruit',label:'Fruité'},
  {k:'mineral',label:'Minéral (fait saliver)'},
  {k:'length',label:'Longueur en bouche'},
  {k:'nose',label:'Nez'},
  {k:'overall',label:'Avis général'}
];
var STATUS={sealed:'Non ouvert',open:'Ouvert',empty:'Vide'};
var DEFAULT_TYPES=['Single malt','Blended scotch','Blended malt','Single grain','Bourbon','Rye','Whisky japonais','Coffey Malt','Irish whiskey'];
var DEFAULT_TAGS=['Fumé','Tourbé','Épicé','Fruité','Vanillé','Boisé','Floral','Maritime','Sherry','Doux'];
var SORTS=[['added','Date d’ajout'],['name','Nom'],['overall','Avis général'],['price','Prix'],['abv','Degré'],['age','Âge indiqué']].concat(CRITERIA.filter(function(c){return c.k!=='overall'}).map(function(c){return [c.k,c.label]}));
var GLASS='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10l-1 7a5 5 0 0 1-3 4.5V19h3v2H8v-2h3v-4.5A5 5 0 0 1 8 10z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';

var S={whiskies:[],friends:[],view:'list',id:null,draft:null,mode:'pending',loaded:{w:false,f:false},slow:false,
  filters:{q:'',status:'',type:'',tag:'',friend:'',min:'',fav:false,buy:false},sort:'added',dir:'desc',showFilters:false,confirmDel:false,confirmFriend:null,uploading:false,formError:''};
var DB=null,ASSETS=null,SAMPLE=null,CAN_IMG=false,BLOBS=new WeakMap(),readCtl=null;

/* ---------- storage ---------- */
/* ---------- storage (IndexedDB sur l'appareil) ---------- */
var APP_VERSION='0.7',APP_DATE='8 novembre 2026',IDBH=null,MEMONLY=false;
function idbOpen(){return new Promise(function(res,rej){
  var r=indexedDB.open('cave-whisky',1);
  r.onupgradeneeded=function(){var d=r.result;d.createObjectStore('whiskies',{keyPath:'id'});d.createObjectStore('friends',{keyPath:'id'})};
  r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};r.onblocked=function(){rej(new Error('blocked'))}})}
function idbAll(col){return new Promise(function(res,rej){var q=IDBH.transaction(col).objectStore(col).getAll();q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})}
function idbPut(col,obj){return new Promise(function(res,rej){var t=IDBH.transaction(col,'readwrite');t.objectStore(col).put(obj);t.oncomplete=function(){res()};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error||new Error('abort'))}})}
function idbDel(col,id){return new Promise(function(res,rej){var t=IDBH.transaction(col,'readwrite');t.objectStore(col).delete(id);t.oncomplete=function(){res()};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error||new Error('abort'))}})}
function upsert(col,obj){var a=S[col],i=a.findIndex(function(x){return x.id===obj.id});if(i>=0)a[i]=obj;else a.push(obj)}
async function put(col,obj){var c=JSON.parse(JSON.stringify(obj));c.upd=Date.now();upsert(col,c);if(!MEMONLY)await idbPut(col,c)}
async function removeDoc(col,id){addTomb(col==='whiskies'?'w':'f',id,Date.now());S[col]=S[col].filter(function(x){return x.id!==id});if(!MEMONLY)await idbDel(col,id)}
function lastExport(){try{return Number(localStorage.getItem('cave-last-export'))||0}catch(e){return 0}}
function lastExportText(){var l=lastExport();return l?'Dernier export : '+new Date(l).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})+'.':'Aucun export pour l’instant.'}
function backupBanner(){
  if(MEMONLY)return '<div class="banner" role="alert">Le stockage de cet appareil est indisponible : tes fiches ne seront pas conservées. Exporte-les depuis l’onglet Échange.</div>';
  if(!S.whiskies.length)return '';
  var l=lastExport(),days=l?Math.floor((Date.now()-l)/864e5):null;
  if(l&&days<30)return '';
  return '<div class="banner">'+(l?'Dernière sauvegarde il y a '+days+' jours.':'Aucune sauvegarde pour l’instant.')+' Va dans <b>Échange</b> pour exporter tes fiches.</div>';
}
function newId(){return 'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

async function boot(){
  render();
  try{IDBH=await idbOpen();S.whiskies=await idbAll('whiskies');S.friends=await idbAll('friends')}catch(e){MEMONLY=true}
  S.mode='local';S.loaded={w:true,f:true};
  initDownloads();
  render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  try{if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js')}catch(e){}
}

/* ---------- synchronisation Google Drive (espace caché de l'appli) ---------- */
/* Une fiche = un fichier sur le Drive (w_<id>.json), un ami = f_<id>.json, une suppression = x_<col>_<id>.
   Fusion fiche par fiche : la modification la plus récente gagne. */
var GCLIENT='163280160875-e3ml082aeieji23312rj1cad07u87fcv.apps.googleusercontent.com';
var GSCOPE='https://www.googleapis.com/auth/drive.appdata';
var SYKEY='cave-sync-v1',TOMBKEY='cave-tomb-v1',AUTOKEY='cave-autosync';
var G={busy:false,msg:'',tok:'',exp:0,report:null,pending:false};
function lsGet(k,def){try{var v=JSON.parse(localStorage.getItem(k));return v==null?def:v}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function syncInfo(){return lsGet(SYKEY,{})}
function devName(){try{return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)?'téléphone':'PC'}catch(e){return 'appareil'}}
function fmtDT(v){try{return new Date(v).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}catch(e){return String(v||'')}}
function tombs(){return lsGet(TOMBKEY,{})}
function addTomb(col,id,ts){var t=tombs();t[col+':'+id]=ts;lsSet(TOMBKEY,t)}
function updOf(o){return Number(o&&o.upd)||Number(o&&o.added)||0}
function lastChange(){var m=0;S.whiskies.concat(S.friends).forEach(function(o){var u=Number(o.upd)||0;if(u>m)m=u});var t=tombs();Object.keys(t).forEach(function(k){if(t[k]>m)m=t[k]});return m}
function syncDirty(){var i=syncInfo();return !!i.at&&lastChange()>i.at}
function loadGsi(){return new Promise(function(res,rej){
  if(window.google&&google.accounts&&google.accounts.oauth2)return res();
  var s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;
  s.onload=function(){res()};s.onerror=function(){rej(new Error('offline'))};document.head.appendChild(s)})}
function gToken(){
  if(G.tok&&Date.now()<G.exp)return Promise.resolve(G.tok);
  return new Promise(function(resolve,reject){
    var tc=google.accounts.oauth2.initTokenClient({client_id:GCLIENT,scope:GSCOPE,
      callback:function(r){if(r&&r.access_token){G.tok=r.access_token;G.exp=Date.now()+((r.expires_in||3600)-120)*1000;resolve(G.tok)}else reject(new Error((r&&r.error)||'auth'))},
      error_callback:function(e){reject(new Error((e&&e.type)||'auth'))}});
    tc.requestAccessToken({prompt:''})})}
async function dFetch(tok,url,opt){
  opt=opt||{};var r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+tok},opt.headers||{})}));
  if(!r.ok){var t=await r.text().catch(function(){return''});throw new Error('drive '+r.status+' '+t.slice(0,160))}
  return r}
async function dList(tok){
  var out=[],pt='';
  do{var r=await dFetch(tok,'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=1000&fields='+encodeURIComponent('nextPageToken,files(id,name,appProperties)')+(pt?'&pageToken='+encodeURIComponent(pt):''));
    var j=await r.json();out=out.concat(j.files||[]);pt=j.nextPageToken||''}while(pt);
  return out}
async function dPut(tok,id,name,upd,body,by){
  var b='cave'+Date.now()+Math.random().toString(36).slice(2),meta={name:name,appProperties:{upd:String(upd)}};if(by)meta.appProperties.by=by;

function planForce(files,mode){

async function safetyCopy(plan,mode){

function planSync(files){
  var P0=parseFiles(files),rdoc=P0.rdoc,rtomb=P0.rtomb,plan={up:[],down:[],delLocal:[],delRemote:[],mkTomb:[],conflicts:[]};
  var ldoc={};S.whiskies.forEach(function(o){ldoc['w:'+o.id]=o});S.friends.forEach(function(o){ldoc['f:'+o.id]=o});
  var lt=tombs(),keys={};
  [rdoc,rtomb,ldoc,lt].forEach(function(m){Object.keys(m).forEach(function(k){keys[k]=1})});
  var at=syncInfo().at||0;

    var ld=ldoc[k],rd=rdoc[k],lts=lt[k]||0,rt=rtomb[k],rts=rt?rt.upd:0;

  if(/drive 403/.test(m))return 'Google refuse l’accès : vérifie que « Google Drive API » est activée dans le projet Google Cloud. ('+m+')';
  if(/drive 401/.test(m)){G.tok='';return 'La connexion Google a expiré : touche de nouveau « Synchroniser ».'}

function uniq(a){return Array.from(new Set(a.filter(Boolean))).sort(function(x,y){return String(x).localeCompare(String(y),'fr')})}
function activeFilters(){var f=S.filters,n=0;['status','type','tag','friend','min'].forEach(function(k){if(f[k])n++});if(f.fav)n++;if(f.buy)n++;return n}
function applyFilters(){
  var f=S.filters,q=f.q.trim().toLowerCase();
  var list=S.whiskies.filter(function(w){
    if(q&&![w.name,w.distillery,w.country,w.type,w.notes].join(' ').toLowerCase().includes(q))return false;
    if(f.status&&w.status!==f.status)return false;
    if(f.type&&w.type!==f.type)return false;
    if(f.tag&&!(w.tags||[]).includes(f.tag))return false;
    if(f.friend&&!(w.friends||[]).includes(f.friend))return false;
    if(f.min&&!((w.ratings&&w.ratings.overall)>=Number(f.min)))return false;
    if(f.fav&&!w.fav)return false;
    if(f.buy&&!w.buy)return false;
    return true;
  });
  var k=S.sort,dir=S.dir==='asc'?1:-1;
  var val=function(w){if(k==='added')return w.added||0;if(k==='name')return (w.name||'').toLowerCase();if(k==='price'||k==='abv'||k==='age')return w[k];return w.ratings?w.ratings[k]:null};
  list.sort(function(a,b){
    var x=val(a),y=val(b),nx=(x==null),ny=(y==null);
    if(nx&&ny)return 0;if(nx)return 1;if(ny)return -1;
    return (typeof x==='string'?x.localeCompare(y,'fr'):x-y)*dir;
  });
  return list;
}

/* lecture de l’étiquette */
var LABEL_PROMPT=`Tu aides à remplir la fiche d'une bouteille de whisky à partir de la ou des photos de son étiquette (face avant, éventuellement contre-étiquette).
Méthode : 1) lis tout ce qui est écrit ; 2) identifie le produit ; 3) une fois le produit identifié, complète les autres champs avec ta connaissance de ce whisky (c'est le but : remplir un maximum de champs utiles).
Réponds uniquement par un objet JSON de cette forme :
{"name":string|null,"distillery":string|null,"country":string|null,"type":string|null,"age":number|null,"abv":number|null,"volume":number|null,"profile":string[],"inferred":string[],"unreadable":boolean}
Règles :
- name : nom commercial complet tel qu'écrit (marque + cuvée), sans le volume ni le degré.
- distillery : la distillerie qui produit ce whisky (écrite sur l'étiquette, ou connue : par exemple Caol Ila pour "Caol Ila 12 ans").
- country : pays, avec la région ou l'île quand tu la connais (ex. "Écosse, Islay", "Écosse, Speyside", "Japon").
- type : par exemple "Single malt", "Blended scotch", "Blended malt", "Single grain", "Bourbon", "Whisky japonais", "Coffey Malt".
- age : nombre d'années inscrit sur l'étiquette, sinon null (ne jamais deviner un âge). abv : degré en % ; s'il n'est pas lisible mais que le produit est connu, donne le degré habituel de cette cuvée. volume : en cl (0,7 L donne 70) ; sinon null.
- profile : 3 à 6 mots qui décrivent le style de ce whisky tel que le décrivent les connaisseurs, en français, parmi par exemple : Fumé, Tourbé, Maritime, Iodé, Épicé, Poivré, Fruité, Agrumes, Vanillé, Miel, Floral, Boisé, Sherry, Doux, Malté, Fruits secs. Donne-les dès que tu connais le produit ou son style (région, type de fût).
- Ne donne aucun prix et aucune note.
- Si une valeur t'est vraiment inconnue, mets null. Mais si tu connais le produit, remplis.
- inferred : toutes les clés que tu n'as pas lues sur l'étiquette mais déduites de ta connaissance (par exemple ["distillery","country","type","profile"]).
- unreadable : true seulement si les photos ne permettent pas du tout d'identifier le whisky.`;

async function geminiCall(parts,signal){
  var delays=[2500,5000],last;
  for(var t=0;t<=delays.length;t++){
    try{return await geminiOnce(parts,signal)}
    catch(e){last=e;var c=e&&e.code;
      if(!(c==='network'||c==='http500'||c==='http502'||c==='http503'||c==='http504')||t===delays.length)throw e;
      if(signal&&signal.aborted){var ce=new Error('cancelled');ce.code='cancelled';throw ce}
      toast('Connexion difficile, nouvelle tentative…');
      await new Promise(function(res){setTimeout(res,delays[t])})}}
  throw last}
async function geminiOnce(parts,signal){
  var r;
  try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(aiModel())+':generateContent',{method:'POST',signal:signal,
    headers:{'Content-Type':'application/json','x-goog-api-key':aiKey()},
    body:JSON.stringify({contents:[{role:'user',parts:parts}],generationConfig:{temperature:.1,responseMimeType:'application/json'}})})}
  catch(e){if(e&&e.name==='AbortError'){var c=new Error('cancelled');c.code='cancelled';throw c}var n=new Error('réseau');n.code='network';throw n}
  if(!r.ok){var t='';try{t=await r.text()}catch(e){}var er=new Error('http '+r.status+' '+t.slice(0,200));er.code='http'+r.status;er.detail=t;throw er}
  var j=await r.json(),c0=j.candidates&&j.candidates[0],txt=c0&&c0.content&&c0.content.parts&&c0.content.parts.map(function(x){return x.text||''}).join('');
  if(!txt){var e2=new Error('vide');e2.code='empty';throw e2}
  return txt}
function parseJsonLoose(t){t=String(t).trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();try{return JSON.parse(t)}catch(e){var m=/\{[\s\S]*\}/.exec(t);if(m)return JSON.parse(m[0]);throw e}}
async function readLabel(){
  var d=S.draft;if(!d||S.reading||!d.photos.length)return;
  if(!aiKey()){toast('Ajoute d’abord ta clé dans l’onglet Échange.');return}
  S.reading=true;photosBox();
  readCtl=new AbortController();
  try{
    var parts=[{text:LABEL_PROMPT}];
    for(var i=0;i<d.photos.length;i++){var p=d.photos[i],b=BLOBS.get(p);if(!b){var r=await fetch(photoSrc(p));b=await r.blob()}
      try{b=await shrink(b,1200,.78)}catch(e){}
      parts.push({inline_data:{mime_type:b.type||'image/jpeg',data:await blobB64(b)}})}
    var txt=await geminiCall(parts,readCtl.signal),j;
    try{j=parseJsonLoose(txt)}catch(e){var pe=new Error('json');pe.code='invalid_json';throw pe}
    applyLabel(j);
  }catch(e){labelError(e)}
  S.reading=false;readCtl=null;photosBox();
}
function applyLabel(j){
  if(!j||typeof j!=='object'||j.unreadable){toast('Étiquette illisible. Reprends la photo de plus près.');return}
  var guess=Array.isArray(j.inferred)?j.inferred:[],n=0;
  var set=function(k,val,force){
    var el=$('#f-'+k);if(!el||val==null||val==='')return;
    if(typeof val==='string')val=val.trim();
    if(el.type==='number'){val=Number(val);if(!isFinite(val)||val<=0)return}
    if(el.value.trim()!==''&&!force)return;
    el.value=val;el.classList.add('auto');if(guess.indexOf(k)>=0)el.classList.add('guess');n++;
  };
  set('name',j.name);set('distillery',j.distillery);set('country',j.country);set('type',j.type);set('age',j.age);set('abv',j.abv);
  var vol=$('#f-volume');set('volume',j.volume,vol&&vol.value.trim()==='70');
  if(Array.isArray(j.profile)){var added=false;j.profile.slice(0,4).forEach(function(t){t=String(t||'').trim();if(t&&!S.draft.tags.includes(t)){S.draft.tags.push(t);added=true;n++}});if(added)tagsBox()}
  toast(n?'Fiche remplie ('+n+' champ'+(n>1?'s':'')+'). Vérifie avant d’enregistrer.':'Rien de plus à remplir depuis cette photo.');
}
function aiErrText(e){
  var c=e&&e.code,d=(e&&e.detail)||'';
  if(c==='cancelled')return '';
  if(c==='network')return 'Connexion impossible après plusieurs essais : vérifie le réseau (Wi-Fi ou données) puis réessaie.';
  if(c==='http400'&&/API key|API_KEY/i.test(d))return 'Clé refusée : vérifie que tu l’as collée en entier.';
  if(c==='http401'||c==='http403')return 'Clé refusée ou accès non autorisé : vérifie la clé dans l’onglet Échange.';
  if(c==='http503'||c==='http500')return 'Le service Google est surchargé : réessaie dans un instant.';
  if(c==='http404')return 'Modèle introuvable : change son nom dans l’onglet Échange (ou remets « '+AI_DEFAULT_MODEL+' »).';
  if(c==='http429')return 'Quota gratuit atteint : réessaie plus tard (la remise à zéro se fait chaque jour).';
  if(c==='invalid_json'||c==='empty')return 'Étiquette non lue. Reprends la photo de plus près.';
  if(c==='http400')return 'Demande refusée par le service (image trop lourde ou modèle sans lecture d’image ?).';
  return 'Lecture interrompue. Réessaie.';
}
function labelError(e){var m=aiErrText(e);if(m)toast(m)}

/* photos */
function shrink(file,max,q){return new Promise(function(res,rej){
  var url=URL.createObjectURL(file),im=new Image();
  im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(function(b){b?res(b):rej(new Error('blob'))},'image/jpeg',q)};
  im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'))};im.src=url})}
function toDataURL(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(b)})}
async function addPhoto(file){
  if(!file||!S.draft)return;
  S.uploading=true;photosBox();
  try{
    var p=null;
    var big=await shrink(file,1400,.82);
    if(ASSETS){try{var r=await ASSETS.upload(big,{type:'image/jpeg'});p={id:r.id}}catch(e){p=null}}
    if(!p)p={data:await toDataURL(await shrink(file,720,.7))};
    BLOBS.set(p,big);
    if(S.draft)S.draft.photos.push(p);
  }catch(e){toast('Impossible de lire cette image.')}
  S.uploading=false;photosBox();
}

function xpGroups(items){
  if(!items.length)return [];
  var sp=XP.split;
  if(sp==='none')return [{key:'all',label:'Collection',items:items}];
  var map={},order=[];
  items.forEach(function(w){
    var k,l;
    if(sp==='status'){k=w.status||'sealed';l=STATUS[k]||STATUS.sealed}
    else if(sp==='type'){l=w.type||'Sans type';k=l}
    else if(sp==='marker'){l=w.fav?'Préférés':(w.buy?'À acheter':'Autres');k=l}

    if(!map[k]){map[k]={key:k,label:l,items:[]};order.push(k)}

/* import */
function normW(r){
  if(!r||typeof r!=='object')return null;
  var s=function(v){return v==null?'':String(v).trim()},arr=function(v){return Array.isArray(v)?v:[]};
  var name=s(r.name);if(!name)return null;
  var rt={};
  if(r.ratings&&typeof r.ratings==='object'){CRITERIA.forEach(function(c){var raw=r.ratings[c.k],v=Number(raw);if(raw!=null&&raw!==''&&isFinite(v))rt[c.k]=Math.max(0,Math.min(10,Math.round(v)))})}
  var tags=Array.from(new Set(arr(r.tags).concat(arr(r.profile)).map(s).filter(Boolean))).slice(0,12);
  var photos=arr(r.photos).map(function(p){return typeof p==='string'?p:(p&&p.data)}).filter(function(p){return typeof p==='string'&&/^data:image\/(jpeg|png|webp|gif);base64,/.test(p)}).slice(0,2);
  var links=arr(r.links).map(function(l){return {label:s(l&&l.label),url:s(l&&l.url),note:s(l&&l.note)}}).filter(function(l){return /^https?:\/\//i.test(l.url)}).slice(0,3);
  var pos=function(v){var x=num(v);return x!=null&&x>0?x:null};
  var price=num(r.price),added=Number(r.added),id=s(r.id);
  return {id:/^[A-Za-z0-9_-]{1,60}$/.test(id)?id:null,name:name,distillery:s(r.distillery),country:s(r.country),type:s(r.type),
    age:pos(r.age),abv:pos(r.abv),volume:pos(r.volume),price:(price!=null&&price>=0)?price:null,
    status:Object.prototype.hasOwnProperty.call(STATUS,r.status)?r.status:'sealed',fav:!!r.fav,buy:!!r.buy,tags:tags,photos:photos,ratings:rt,notes:s(r.notes),
    friendNames:arr(r.friends).map(function(f){return s(f&&typeof f==='object'?f.name:f)}).filter(Boolean),links:links,added:(isFinite(added)&&added>0)?added:Date.now()};
}
function wKey(w){return (String(w.name||'')+'|'+String(w.distillery||'')).trim().toLowerCase()}
function absorb(label,txt){
  var j;try{j=JSON.parse(String(txt).replace(/^﻿/,''))}catch(e){IM.files.push({name:label,err:'Contenu illisible (JSON invalide).'});return}
  var ws=[],fr=[];
  if(Array.isArray(j))ws=j;
  else if(j&&typeof j==='object'){
    if(Array.isArray(j.whiskies)){ws=j.whiskies;if(Array.isArray(j.friends))fr=j.friends}
    else if(j.name)ws=[j];
    else if(Array.isArray(j.friends))fr=j.friends;
    else{IM.files.push({name:label,err:'Format non reconnu.'});return}
  }else{IM.files.push({name:label,err:'Format non reconnu.'});return}
  var ok=0,bad=0;
  ws.forEach(function(r){var w=normW(r);if(w){IM.raw.push(w);ok++}else bad++});
  var fn=fr.map(function(f){return String(f&&typeof f==='object'?f.name:f||'').trim()}).filter(Boolean);
  fn.forEach(function(n){IM.fr.push(n)});
  IM.files.push({name:label,count:ok,bad:bad,friends:fn.length});
}
async function readImportFiles(files){
  if(IM&&IM.busy)return;
  IM={files:[],raw:[],fr:[],items:[],friendsNew:[],dup:(IM&&IM.dup)||'skip',busy:true,msg:'Lecture des fichiers…',done:null};
  ibox();
  for(var i=0;i<files.length;i++){
    var f=files[i],low=f.name.toLowerCase();
    try{
      if(/\.zip$/.test(low)){
        if(!window.JSZip){IM.files.push({name:f.name,err:'Lecture des ZIP indisponible ici.'});continue}
        var z=await JSZip.loadAsync(f);
        var names=Object.keys(z.files).filter(function(n){return !z.files[n].dir&&/\.json$/i.test(n)&&!/(^|\/)__MACOSX\//.test(n)&&!/(^|\/)\./.test(n)});
        if(!names.length)IM.files.push({name:f.name,err:'Aucun fichier .json dans cette archive.'});
        for(var k=0;k<names.length;k++)absorb(f.name+' › '+names[k],await z.files[names[k]].async('string'));
      }else absorb(f.name,await f.text());
    }catch(e){IM.files.push({name:f.name,err:'Fichier illisible.'})}
  }
  var seen={},exId={},exKey={};
  S.whiskies.forEach(function(w){exId[w.id]=w.id;exKey[wKey(w)]=w.id});
  IM.raw.forEach(function(w){
    var key=wKey(w);
    if((w.id&&seen['i:'+w.id])||seen['k:'+key]){IM.skipIn=(IM.skipIn||0)+1;return}
    if(w.id)seen['i:'+w.id]=1;seen['k:'+key]=1;
    w._ex=(w.id&&exId[w.id])||exKey[key]||null;
    IM.items.push(w);
  });
  var have={};S.friends.forEach(function(f){have[f.name.toLowerCase()]=1});
  var names=IM.fr.slice();IM.items.forEach(function(w){w.friendNames.forEach(function(n){names.push(n)})});
  var added={};IM.friendsNew=[];
  names.forEach(function(n){var k=n.toLowerCase();if(!have[k]&&!added[k]){added[k]=1;IM.friendsNew.push(n)}});
  IM.busy=false;IM.msg='';ibox();
}
function ibox(){
  var el=$('#ibox');if(!el)return;
  var h='<p class="hint">Choisis un ou plusieurs fichiers .json, ou une archive .zip. Les fiches au format « Coller une fiche » sont acceptées aussi.</p>'+
    '<div class="row"><label class="btn filebtn'+(IM&&IM.busy?' ghost':'')+'">Choisir des fichiers<input type="file" id="imp-file" accept=".json,.zip,application/json,application/zip,application/x-zip-compressed" multiple aria-label="Choisir des fichiers à importer"></label></div>';
  if(IM&&IM.busy){h+='<p class="hint" id="istat">'+esc(IM.msg||'…')+'</p>'}
  else if(IM&&IM.done){
    var d=IM.done;
    h+='<div class="banner" role="status">Import terminé : '+plural(d.added,'fiche')+' ajoutée'+(d.added>1?'s':'')+(d.replaced?', '+plural(d.replaced,'fiche')+' remplacée'+(d.replaced>1?'s':''):'')+(d.skipped?', '+plural(d.skipped,'doublon')+' ignoré'+(d.skipped>1?'s':''):'')+(d.failed?', '+plural(d.failed,'erreur'):'')+(d.friends?', '+plural(d.friends,'ami')+' ajouté'+(d.friends>1?'s':''):'')+'.</div>'+
      '<div class="row"><button type="button" class="btn" data-act="imdone">Voir la collection</button></div>';
  }else if(IM){
    var nNew=IM.items.filter(function(w){return !w._ex}).length,nDup=IM.items.length-nNew;
    h+='<div class="flist">'+IM.files.map(function(f){return '<div class="frow"><span class="nm">'+esc(f.name)+'</span>'+(f.err?'<span class="err">'+esc(f.err)+'</span>':'<span class="hint">'+plural(f.count,'fiche')+(f.friends?' · '+plural(f.friends,'ami'):'')+(f.bad?' · '+f.bad+' sans nom':'')+'</span>')+'</div>'}).join('')+'</div>';
    h+='<p><b>'+plural(IM.items.length,'fiche')+'</b> à importer : '+nNew+' nouvelle'+(nNew>1?'s':'')+(nDup?', '+nDup+' déjà présente'+(nDup>1?'s':''):'')+(IM.skipIn?' ('+plural(IM.skipIn,'doublon')+' ignoré'+(IM.skipIn>1?'s':'')+' dans les fichiers)':'')+'.'+(IM.friendsNew.length?' '+(IM.friendsNew.length>1?IM.friendsNew.length+' nouveaux amis':'1 nouvel ami')+' à créer.':'')+'</p>';
    if(nDup){
      var rd=function(v,l){return '<label class="chk"><input type="radio" name="imdup" data-im="dup" value="'+v+'"'+(IM.dup===v?' checked':'')+'> '+l+'</label>'};
      h+='<div class="fld"><span>Fiches déjà présentes (même identifiant, ou même nom et distillerie)</span>'+rd('skip','Les ignorer')+rd('replace','Les remplacer par la version importée')+rd('both','Garder les deux')+'</div>';
    }
    h+='<div class="row"><button type="button" class="btn" data-act="import"'+((IM.items.length||IM.friendsNew.length)?'':' disabled')+'>Importer</button><button type="button" class="btn ghost" data-act="imcancel">Annuler</button></div>';
  }
  el.innerHTML=h;
}
async function importPhoto(uri){
  var c=await srcCanvas(uri,1400);
  if(ASSETS){try{var r=await ASSETS.upload(await canvasBlob(c,.82),{type:'image/jpeg'});return {id:r.id}}catch(e){}}
  return {data:(await srcCanvas(uri,720)).toDataURL('image/jpeg',.7)};
}
async function runImport(){
  if(!IM||IM.busy||IM.done)return;
  IM.busy=true;IM.msg='Import en cours…';ibox();
  var res={added:0,replaced:0,skipped:0,failed:0,friends:0};
  var fmap={};S.friends.forEach(function(f){fmap[f.name.toLowerCase()]=f.id});
  var ensure=async function(name){
    name=String(name||'').trim();if(!name)return null;
    var k=name.toLowerCase();if(fmap[k])return fmap[k];
    var id=newId();await put('friends',{id:id,name:name});fmap[k]=id;res.friends++;return id;
  };
  try{
    for(var a=0;a<IM.friendsNew.length;a++)await ensure(IM.friendsNew[a]);
    for(var i=0;i<IM.items.length;i++){
      var it=IM.items[i],pol=IM.dup;
      setStat('istat','Import '+(i+1)+'/'+IM.items.length+'…');
      if(it._ex&&pol==='skip'){res.skipped++;continue}
      var replace=!!it._ex&&pol==='replace';
      var id=replace?it._ex:((!it._ex&&it.id&&!find(it.id))?it.id:newId());
      try{
        var photos=[];
        for(var p=0;p<it.photos.length;p++){try{photos.push(await importPhoto(it.photos[p]))}catch(e){}}
        var old=replace?find(id):null;
        if(old&&!photos.length)photos=old.photos||[];
        var fr=[];
        for(var n=0;n<it.friendNames.length;n++){var fid=await ensure(it.friendNames[n]);if(fid&&fr.indexOf(fid)<0)fr.push(fid)}
        await put('whiskies',{id:id,name:it.name,distillery:it.distillery,country:it.country,type:it.type,age:it.age,abv:it.abv,volume:it.volume,price:it.price,status:it.status,fav:it.fav,buy:it.buy,tags:it.tags,photos:photos,ratings:it.ratings,notes:it.notes,friends:fr,links:it.links,added:it.added});
        if(replace)res.replaced++;else res.added++;
      }catch(e){res.failed++}
    }
  }catch(e){toast('Import interrompu'+(e&&e.code?' ('+e.code+')':'.'))}
  IM.busy=false;IM.done=res;
  var h=$('.sub');if(h)h.textContent=summary();
  ibox();
}

/* ---------- events ---------- */
document.addEventListener('click',async function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,d=S.draft;
  switch(a){
    case 'tab':go(b.dataset.v==='form'?'form':b.dataset.v);break;
    case 'open':go('detail',b.dataset.id);break;
    case 'edit':go('form',b.dataset.id);break;
    case 'cancel':if(d&&d.exists)go('detail',d.id);else go('list');break;
    case 'filters':S.showFilters=!S.showFilters;$('#filters').hidden=!S.showFilters;b.setAttribute('aria-expanded',S.showFilters);break;
    case 'dir':S.dir=S.dir==='asc'?'desc':'asc';b.textContent=S.dir==='asc'?'↑':'↓';renderResults();break;
    case 'reset':S.filters={q:'',status:'',type:'',tag:'',friend:'',min:'',fav:false,buy:false};S.sort='added';S.dir='desc';render();break;
    case 'status':{var w=find(S.id);if(w&&w.status!==b.dataset.s){try{await put('whiskies',Object.assign({},w,{status:b.dataset.s}));render()}catch(err){toast('Modification impossible.')}}break}
    case 'del':S.confirmDel=true;render();break;
    case 'delno':S.confirmDel=false;render();break;
    case 'delok':try{await removeDoc('whiskies',b.dataset.id);toast('Fiche supprimée.');go('list')}catch(err){toast('Suppression impossible.')}break;
    case 'tag':{var t=b.dataset.t,i=d.tags.indexOf(t);if(i>=0)d.tags.splice(i,1);else d.tags.push(t);b.setAttribute('aria-pressed',i<0);break}
    case 'addtag':{var el=$('#f-newtag'),v=el.value.trim();if(v){if(!d.tags.includes(v))d.tags.push(v);tagsBox()}break}
    case 'friend':{var id=b.dataset.id,j=d.friends.indexOf(id);if(j>=0)d.friends.splice(j,1);else d.friends.push(id);b.setAttribute('aria-pressed',j<0);break}
    case 'addfriend-form':{var inp=$('#f-newfriend');if(await addFriend(inp.value)){refreshFriendsBox();var nf=S.friends.find(function(f){return f.name.toLowerCase()===inp.value.trim().toLowerCase()});if(nf&&S.draft&&!S.draft.friends.includes(nf.id))S.draft.friends.push(nf.id);refreshFriendsBox()}break}
    case 'rmphoto':d.photos.splice(Number(b.dataset.i),1);photosBox();break;
        case 'addlink':d.links=readLinks();d.links.push({label:'',url:'',note:''});linksBox();break;
    case 'paste':pasteImport();break;
    case 'read':readLabel();break;
    case 'readstop':if(readCtl)readCtl.abort();break;
    case 'export':runExport();break;
    case 'xall':S.whiskies.forEach(function(w){XP.pick[w.id]=true});xbox();break;
    case 'xnone':XP.pick={};xbox();break;
    case 'import':runImport();break;
    case 'imcancel':IM=null;ibox();break;
    case 'imdone':IM=null;go('list');break;
    case 'fdel':S.confirmFriend=b.dataset.id;render();break;
    case 'fdelno':S.confirmFriend=null;render();break;
    case 'fdelok':try{await removeDoc('friends',b.dataset.id);S.confirmFriend=null;render()}catch(err){toast('Suppression impossible.')}break;
  }
});
function rateSet(el){
  if(!el.matches||!el.matches('select[data-rate]'))return;
  var k=el.dataset.k,row=document.querySelector('.rate[data-k="'+k+'"]');
  if(el.value===''){delete S.draft.ratings[k];row.classList.add('unset')}
  else{S.draft.ratings[k]=Number(el.value);row.classList.remove('unset')}
}
document.addEventListener('change',function(e){rateSet(e.target)});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.f){var k=t.dataset.f;S.filters[k]=t.type==='checkbox'?t.checked:t.value;renderResults()}
  else if(t.dataset&&t.dataset.s){S.sort=t.value;renderResults()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.photo){var f=t.files&&t.files[0];t.value='';addPhoto(f)}
  else if(t.dataset&&t.dataset.f&&t.tagName==='SELECT'){S.filters[t.dataset.f]=t.value;renderResults()}
});
document.addEventListener('submit',async function(e){
  e.preventDefault();
  if(e.target.id==='wform')saveForm();
  else if(e.target.id==='fform'){var i=$('#f-friend');if(await addFriend(i.value)){render();var n=$('#f-friend');if(n)n.focus()}}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='f-newtag'){e.preventDefault();var b=document.querySelector('[data-act="addtag"]');if(b)b.click()}
  if(e.key==='Enter'&&e.target.id==='f-newfriend'){e.preventDefault();var c=document.querySelector('[data-act="addfriend-form"]');if(c)c.click()}
});

document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='imp-file'){var fs=Array.prototype.slice.call(t.files||[]);t.value='';if(fs.length)readImportFiles(fs);return}
  if(t.dataset&&t.dataset.x){XP[t.dataset.x]=(t.type==='checkbox')?t.checked:t.value;xbox();return}
  if(t.dataset&&t.dataset.xp){XP.pick[t.dataset.xp]=t.checked;var pb=$('.pickbox'),sc=pb?pb.scrollTop:0;xbox();pb=$('.pickbox');if(pb)pb.scrollTop=sc;return}
  if(t.dataset&&t.dataset.im==='dup'&&IM){IM.dup=t.value}
});
function wbQuery(name,dist){var q=String(name||'').trim();dist=String(dist||'').trim();if(dist&&q.toLowerCase().indexOf(dist.toLowerCase())<0)q=dist+' '+q;return 'https://www.whiskybase.com/search?q='+encodeURIComponent(q)}
function wbHref(){var n=$('#f-name'),d=$('#f-distillery');return wbQuery(n&&n.value,d&&d.value)}
function wbSync(){var a=$('#wb-link');if(a)a.href=wbHref()}
document.addEventListener('input',function(e){var id=e.target&&e.target.id;if(id==='f-name'||id==='f-distillery')wbSync()});
['pointerdown','focusin'].forEach(function(ev){document.addEventListener(ev,function(e){if(e.target&&e.target.id==='wb-link')wbSync()})});
document.addEventListener('input',function(e){var t=e.target;if(t&&t.classList&&t.classList.contains('auto'))t.classList.remove('auto','guess')});
boot();
})();
</script>
